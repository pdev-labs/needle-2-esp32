name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: esp32/needle_demo

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            esp32/needle_demo/build/bootloader/bootloader.bin
            esp32/needle_demo/build/partition_table/partition-table.bin
            esp32/needle_demo/build/needle_demo.bin
            esp32/needle_demo/build/flasher_args.json
